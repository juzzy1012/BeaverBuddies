name: TimberNet integration

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: timbernet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build transport and session tests
        run: dotnet build TimberNet.IntegrationTests/TimberNet.IntegrationTests.csproj -c Release

      - name: Stress transport and session tests
        shell: bash
        run: |
          for run in {1..10}; do
            dotnet run --project TimberNet.IntegrationTests/TimberNet.IntegrationTests.csproj -c Release --no-build
          done
